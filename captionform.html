	<script>
    function sendHeight() {
        const height = document.body.scrollHeight;
        window.parent.postMessage({
            type: 'resize-iframe',
            height: height
        }, '*'); // En producción, cambia '*' por tu dominio principal por seguridad
    }

    // Enviamos la altura al cargar y si la ventana cambia de tamaño
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);

    // Opcional: Si la landing tiene elementos que aparecen después (acordeones, etc)
    const observer = new ResizeObserver(sendHeight);
    observer.observe(document.body);
</script>

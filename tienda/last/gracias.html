<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado de tu pedido — AI Solutions4You</title>
<link rel="stylesheet" href="/tienda/assets/tienda.css">
</head>
<body>
<div class="tienda-wrap">
  <header class="tienda-header">
    <a class="logo" href="/tienda/">
      <img src="/tienda/assets/img/logo-aisolutions.png" alt="AI Solutions4You" width="40" height="40">
      <span>AI Solutions4You</span>
    </a>
  </header>

  <div class="confirmacion" data-contenido>
    <div class="icono">⏳</div>
    <h1>Verificando tu pago…</h1>
    <p>Un momento, estamos confirmando el estado de tu pedido con Openpay.</p>
  </div>

  <nav class="tienda-footer-links">
    <a href="https://www.ai-solutions4you.info/#section-register" target="_blank" rel="noopener">Contacto</a>
    <span aria-hidden="true">·</span>
    <a href="https://www.ai-solutions4you.info/politicadeprivacidad.html" target="_blank" rel="noopener">Aviso de privacidad</a>
  </nav>
</div>

<!-- Botón flotante de WhatsApp (mismo número que en ai-solutions4you.info) -->
<a class="boton-whatsapp" href="https://wa.me/5215652625387" target="_blank" rel="noopener" aria-label="Chatea con nosotros por WhatsApp">
  <img src="/tienda/assets/img/whatsapp-icon.svg" alt="" width="28" height="28">
</a>

<script>
  async function verificar() {
    const params = new URLSearchParams(window.location.search);
    // Caso normal: nosotros mismos ponemos "orden" en la URL.
    // Caso 3D Secure: venimos de vuelta del banco sin query params
    // propios, así que recuperamos el id guardado antes de salir.
    const chargeId = params.get("orden") || params.get("id") || localStorage.getItem("ultimo_cargo_id");
    const cont = document.querySelector("[data-contenido]");

    if (!chargeId) {
      cont.innerHTML = `
        <div class="icono">⚠️</div>
        <h1>No encontramos tu pedido</h1>
        <p>Si realizaste un pago, revisa tu correo o contáctanos con el número de tu tarjeta y fecha.</p>
        <a class="btn-primario" href="/tienda/" style="display:inline-block;margin-top:1rem;text-decoration:none">Volver a la tienda</a>`;
      return;
    }

    try {
      const res = await fetch(`/api/openpay/check-charge?id=${encodeURIComponent(chargeId)}`);
      const data = await res.json();

      localStorage.removeItem("ultimo_cargo_id");

      const esEfectivo = data.payment_method && data.payment_method.type === "store";

      if (res.ok && data.status === "completed") {
        cont.innerHTML = `
          <div class="icono">✅</div>
          <h1>¡Pago confirmado!</h1>
          <p>Tu pedido <strong>${data.id}</strong> fue aprobado. Te enviaremos los detalles por correo.</p>
          <a class="btn-primario" href="/" style="display:inline-block;margin-top:1rem;text-decoration:none">Volver al inicio</a>`;
      } else if (res.ok && data.status === "in_progress" && esEfectivo) {
        const ref = data.payment_method.reference || "";
        const barcodeUrl = data.payment_method.barcode_url || "";
        cont.innerHTML = `
          <div class="icono">🏪</div>
          <h1>Falta pagar en tienda</h1>
          <p>Lleva esta referencia a cualquier OXXO, 7-Eleven u otra tienda participante de Openpay y paga en efectivo. En cuanto se registre el pago te avisaremos por correo.</p>
          <div class="pago-efectivo-detalle">
            <div>Referencia de pago</div>
            <div class="referencia">${ref}</div>
            ${barcodeUrl ? `<img class="barcode" src="${barcodeUrl}" alt="Código de barras de pago">` : ""}
          </div>`;
      } else if (res.ok && data.status === "in_progress") {
        cont.innerHTML = `
          <div class="icono">⏳</div>
          <h1>Tu pago sigue en proceso</h1>
          <p>Esto puede tardar unos minutos. Te avisaremos por correo en cuanto se confirme.</p>`;
      } else {
        cont.innerHTML = `
          <div class="icono">❌</div>
          <h1>El pago no se completó</h1>
          <p>${(data && data.error) || "La transacción fue rechazada o cancelada."}</p>
          <a class="btn-primario" href="/tienda/checkout.html" style="display:inline-block;margin-top:1rem;text-decoration:none">Intentar de nuevo</a>`;
      }
    } catch (e) {
      cont.innerHTML = `
        <div class="icono">⚠️</div>
        <h1>No pudimos verificar el pago</h1>
        <p>Contáctanos indicando la hora de tu compra para confirmar manualmente.</p>`;
    }
  }
  verificar();
</script>
</body>
</html>

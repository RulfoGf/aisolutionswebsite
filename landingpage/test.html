<!DOCTYPE html>
<html>
<head>
    <title>Ejemplo Formulario</title>
</head>
<body>

    <form action="/enviar-datos" method="post">
        <!-- Ejemplo 1: Campo de texto con valor predefinido -->
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" value="Juan Pérez"><br><br>

        <!-- Ejemplo 2: Campo con texto de ayuda (placeholder) -->
        <label for="correo">Correo:</label><br>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com"><br><br>

        <!-- Ejemplo 3: Área de texto grande -->
        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="4" cols="30">+55...</textarea><br><br>

        <input type="submit" value="Enviar">
    </form>

</body>
</html>
